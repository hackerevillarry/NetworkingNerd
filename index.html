<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Larry's Basement</title>

<style>

/* ===========================
   GLOBAL
=========================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    color:#d8d8d8;
    font-family:Consolas, monospace;
    overflow-x:hidden;
}

/* Background */

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at top,#0d3d1b33,transparent 45%),
    repeating-linear-gradient(
        180deg,
        rgba(255,0,0,.025) 0px,
        rgba(255,0,0,.025) 1px,
        transparent 2px,
        transparent 4px
    );

    pointer-events:none;
}

/* ===========================
   CONTAINER
=========================== */

.container{

    width:90%;
    max-width:1000px;

    margin:60px auto;

}

/* ===========================
   HEADER
=========================== */

.header{

    border:1px solid #1f1f1f;
    background:#090909;

    padding:25px;

    margin-bottom:35px;

    box-shadow:0 0 15px rgba(255,0,0,.08);

}

.header h1{

    color:#ff4d4d;

    letter-spacing:4px;

    font-size:32px;

    margin-bottom:10px;

}

.header p{

    color:#7f7f7f;

    font-size:14px;

}

/* ===========================
   SECTION
=========================== */

.section{

    background:#090909;

    border-left:4px solid #ff0000;

    padding:25px;

    margin-bottom:35px;

    box-shadow:0 0 12px rgba(255,0,0,.06);

}

.section h2{

    color:#ff6666;

    margin-bottom:20px;

    text-transform:uppercase;

    letter-spacing:2px;

}

/* ===========================
   ITEMS
=========================== */

.item{

    background:#060606;

    border:1px solid #1d1d1d;

    padding:16px;

    margin-bottom:15px;

    transition:.25s;

}

.item:hover{

    border-color:#ff0000;

    box-shadow:0 0 15px rgba(255,0,0,.15);

}

.item-title{

    color:#ffffff;

    font-size:18px;

    margin-bottom:8px;

}

.item-text{

    color:#9a9a9a;

    margin-bottom:12px;

    font-size:14px;

}

.item a{

    color:#ff5c5c;

    text-decoration:none;

}

.item a:hover{

    text-decoration:underline;

}

/* ===========================
   FOOTER
=========================== */

.footer{

    text-align:center;

    color:#555;

    padding:20px;

    letter-spacing:3px;

    font-size:12px;

}

</style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>Larry's Basement</h1>

        <p><strong>Da Peenar Explosion Chamber</strong></p>

    </div>


    <!-- ======================
         LINKS
    ======================= -->

    <div class="section">

        <h2>Peenars</h2>

        <div class="item">

            <div class="item-title">
                1]
            </div>

            <div class="item-text">
                Passive Network Reconnaissance
            </div>

            <a href="https://networkingnerd.hackerevillarry.workers.dev/PassiveNetworkRecon.md" target="_blank">
                Open Link
            </a>

        </div>

    </div>


    <!-- ======================
         ADD MORE ITEMS
    ======================= -->

    <!--

    Copy this block to add another file or link.

    <div class="item">

        <div class="item-title">
            Title
        </div>

        <div class="item-text">
            Description
        </div>

        <a href="">
            Download / Open Link
        </a>

    </div>

    -->


    <div class="footer">

        ACCESS 

    </div>

</div>

</body>
</html>
